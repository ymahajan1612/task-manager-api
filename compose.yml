services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/taskManager
    
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: taskManager
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres -d taskManager"]
        interval: 5s
        timeout: 5s
        retries: 5

volumes:
  postgres_data: